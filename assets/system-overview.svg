<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">荧光光纤测温技术预览</title>
  <desc id="desc">激励与光纤探头、信号采集、寿命与标定、温度输出。公开原理、系统架构及工程设计要点，核心工程按约定私有交付。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b192b"/><stop offset="1" stop-color="#183e4b"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64d8cc"/></marker>
  </defs>
  <rect width="1200" height="400" rx="22" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans CJK SC, sans-serif">
    <text x="48" y="52" fill="#64d8cc" font-size="15" letter-spacing="3">FLUORESCENCE · FIBER · TEMPERATURE</text>
    <text x="48" y="106" fill="#fff" font-size="36" font-weight="700">看懂测温链路，评估技术价值</text>
    <text x="48" y="143" fill="#b6cedc" font-size="18">系统架构 / 工程设计要点 / 付费技术交付</text>
    <g fill="#163647" stroke="#396271">
      <rect x="48" y="186" width="232" height="92" rx="12"/>
      <rect x="338" y="186" width="232" height="92" rx="12"/>
      <rect x="628" y="186" width="232" height="92" rx="12"/>
      <rect x="918" y="186" width="232" height="92" rx="12"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-size="21" font-weight="600">
      <text x="164" y="224">激励与光纤探头</text><text x="454" y="224">信号采集</text>
      <text x="744" y="224">寿命与标定</text><text x="1034" y="224">温度与状态输出</text>
    </g>
    <g fill="#abc8d7" text-anchor="middle" font-size="14">
      <text x="164" y="253">Optical response</text><text x="454" y="253">Acquisition</text>
      <text x="744" y="253">Estimation &amp; calibration</text><text x="1034" y="253">Readout &amp; validation</text>
    </g>
    <g stroke="#64d8cc" stroke-width="2" marker-end="url(#arrow)">
      <path d="M290 232H326"/><path d="M580 232H616"/><path d="M870 232H906"/>
    </g>
    <path d="M48 312H1150" stroke="#396271"/>
    <text x="48" y="351" fill="#9ee8de" font-size="17">公开预览：原理、系统架构、工程设计要点</text>
    <text x="646" y="351" fill="#fff" font-size="17">完整技术：确认范围后私有交付 · 联系报价</text>
  </g>
</svg>
